# .gitleaks.toml — Vibe Coding Guardrails
# Standalone config (no useDefault) to ensure all custom rules take effect.
# Includes critical rules from gitleaks defaults plus custom rules for regional services.
# Install path: ~/.claude/.gitleaks.toml (copied by the install skill)

# ── Global allowlist ──────────────────────────────────────────────────────────
# Skip environment variable references and template placeholders across all rules.
[allowlist]
description = "Skip env var references and common placeholders"
regexes = [
  '''process\.env\.[A-Z_]+''',
  '''\$\{[A-Z_][A-Z0-9_]*\}''',
  '''os\.environ''',
]

# ══════════════════════════════════════════════════════════════════════════════
# SECTION 1 — Selected rules from gitleaks defaults
# ══════════════════════════════════════════════════════════════════════════════

# AWS Access Key ID
[[rules]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["secret", "aws"]

# AWS Secret Access Key
[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[_\-\.]?secret[_\-\.]?access[_\-\.]?key\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})["']?'''
secretGroup = 1
tags = ["secret", "aws"]

# GitHub Personal Access Token (classic ghp_ and fine-grained github_pat_)
[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''(ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{36,255}'''
tags = ["secret", "github"]

# GitLab Personal Access Token
[[rules]]
id = "gitlab-pat"
description = "GitLab Personal Access Token"
regex = '''glpat-[A-Za-z0-9\-=_]{20,}'''
tags = ["secret", "gitlab"]

# Generic private key (PEM header)
[[rules]]
id = "private-key"
description = "Private key (PEM format)"
regex = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY( BLOCK)?-----'''
tags = ["secret", "key"]

# Stripe secret key
[[rules]]
id = "stripe-secret-key"
description = "Stripe secret or restricted key"
regex = '''(sk|rk)_live_[A-Za-z0-9]{24,}'''
tags = ["secret", "stripe"]

# SendGrid API key
[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}'''
tags = ["secret", "sendgrid"]

# Twilio Account SID + Auth Token
[[rules]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = '''SK[0-9a-fA-F]{32}'''
tags = ["secret", "twilio"]

# JWT token (raw bearer — not a variable assignment)
[[rules]]
id = "jwt-token"
description = "JSON Web Token (raw)"
regex = '''eyJ[A-Za-z0-9_\/+-]{10,}\.[A-Za-z0-9_\/+-]{10,}\.[A-Za-z0-9_\/+-]{10,}'''
tags = ["secret", "jwt"]

  [rules.allowlist]
  # Skip well-known example/test JWTs that appear in docs
  regexes = [
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ''',
  ]

# ══════════════════════════════════════════════════════════════════════════════
# SECTION 2 — Custom rules for Vibe Coding Guardrails
# ══════════════════════════════════════════════════════════════════════════════

# OpenAI project API key (sk-proj- format — not covered by gitleaks defaults)
[[rules]]
id = "openai-project-api-key"
description = "OpenAI project API key (sk-proj- format)"
regex = '''sk-proj-[A-Za-z0-9\-_]{40,}'''
tags = ["secret", "api-key", "openai"]

# Generic hardcoded password assignment
# Catches: password: "xxx" / passwd = "xxx" / pwd: "xxx"
# Skips: placeholders (your-password-here, example, dummy, etc.)
[[rules]]
id = "generic-password-assignment"
description = "Hardcoded password in variable or config"
regex = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*["']([^"'$][^"']{4,})["']'''
secretGroup = 1
tags = ["secret", "password"]

  [rules.allowlist]
  regexes = [
    '''(?i)(your|example|placeholder|dummy|sample|replace|change|fake|test|insert|add.your|xxx)''',
  ]

# Generic hardcoded token or API key variable assignment
# Catches: API_TOKEN = "xyz..." / secret_key: "abc..."
# Skips: process.env.X / ${X} / common placeholders
[[rules]]
id = "hardcoded-token-variable"
description = "Hardcoded token or API key in variable assignment"
regex = '''(?i)(?:token|api[_-]?key|auth[_-]?key|secret[_-]?key|access[_-]?key)\s*[:=]\s*["']([A-Za-z0-9\-_./+]{20,})["']'''
secretGroup = 1
tags = ["secret", "token"]

  [rules.allowlist]
  regexes = [
    '''(?i)^(your[_-]?|example[-_]?|placeholder|dummy|sample|replace[_-]?me|change[_-]?me|fake[_-]?|test[_-]?token|insert[_-]?|add[_-]?your)''',
    '''process\.env''',
    '''\$\{''',
  ]

# LINE Notify Bearer token
[[rules]]
id = "line-notify-bearer-token"
description = "LINE Notify Bearer token hardcoded in variable"
regex = '''(?i)(?:line[_-]?token|line[_-]?notify)\s*[:=]\s*["']Bearer\s+([A-Za-z0-9+/]{20,})["']'''
secretGroup = 1
tags = ["secret", "token", "line"]

# Slack Incoming Webhook URL
[[rules]]
id = "slack-webhook-url"
description = "Slack Incoming Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]{8,}/[A-Z0-9]{8,}/[A-Za-z0-9]{20,}'''
tags = ["secret", "webhook", "slack"]

# Database connection string with hardcoded password
# Catches: postgresql://user:realpass@host / mysql://user:pass123@host
# Skips: ${DB_PASSWORD} and :password@ / :passwd@ literal strings
[[rules]]
id = "connection-string-with-password"
description = "Database or service connection string with hardcoded password"
regex = '''[a-zA-Z][a-zA-Z0-9+\-.]*://[^:@\s"']+:([^@\s"']{8,})@'''
secretGroup = 1
tags = ["secret", "connection-string"]

  [rules.allowlist]
  regexes = [
    '''\$\{''',
    '''(?i)^(password|passwd|pwd)$''',
  ]
